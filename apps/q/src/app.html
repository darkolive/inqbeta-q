<!doctype html>
<html lang="en-GB" data-theme="dark-olive" class="motion-safe:scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			/*
			 * If a page arrives from an older build, its code no longer exists on the
			 * server and Q never starts — which looks like being signed out. Clear the
			 * offline copy and load the page afresh, once. (2026-09-28: Safari on a
			 * refresh was being handed a page whose files had gone.)
			 */
			(function () {
				var KEY = 'q-healed-at';
				function heal() {
					try {
						if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 20000) return;
						sessionStorage.setItem(KEY, String(Date.now()));
					} catch (e) {}
					var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
					sw.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
						.catch(function () {})
						.then(function () { location.reload(); });
				}
				window.addEventListener('error', function (e) {
					var t = e.target;
					if (t && t.tagName === 'SCRIPT' && /\/_app\/immutable\//.test(t.src || '')) heal();
				}, true);
				window.addEventListener('unhandledrejection', function (e) {
					var m = String((e.reason && e.reason.message) || e.reason || '');
					if (/Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module/i.test(m)) heal();
				});
			})();
		</script>
		%sveltekit.head%
		<script>
			// Set the class before first paint so there is no flash of the wrong theme.
			try {
				const saved = localStorage.getItem('inqbeta-q-mode');
				const dark =
					saved === 'dark' ||
					(saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
