# inQbeta node — personal post office (ADR-Q-010).
# Every line here is a must or a cannot; node/bin/check.sh tests each one.

per_listener_settings false

# MUST sign in. Nobody posts or reads anonymously.
allow_anonymous false
password_file /mosquitto/config/passwd
# CANNOT read anyone's inbox but your own (see acl).
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

listener 9001
protocol websockets

# MUST hold sealed messages for people who are away, and survive a restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
persistent_client_expiration 30d
max_queued_messages 1000
max_inflight_messages 20
queue_qos0_messages false

# CANNOT carry anything bigger than a sealed receipt (256 KB). Files go by storage.
max_packet_size 262144

# CANNOT keep anything past delivery: no retained messages.
retain_available false

# CANNOT log who talks to whom (ADR-Q-001: relays keep only that they carried).
# For debugging only, set connection_messages true and switch it back after.
connection_messages false
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
