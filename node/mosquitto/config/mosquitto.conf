# inQbeta node — personal post office (ADR-Q-010).
# Every line here is a must or a cannot; node/bin/check.sh tests each one.

# Each listener has its own rules (1 October 2026): two private ones where
# everyone signs in, and one public one that can only listen to federations'
# news pings (ADR-Q-016 §6).
per_listener_settings true

# MUST sign in. Nobody posts or reads anonymously.
# CANNOT read anyone's inbox but your own (see acl).
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# PUBLIC, READ-ONLY: anyone may listen for "federation X has news"; nobody may
# publish here. The ping carries no content — members collect the signed
# announcement from the storage unit. Reached as wss://bellboy… through Caddy.
listener 9002
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl-public

# MUST hold sealed messages for people who are away, and survive a restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
persistent_client_expiration 30d
max_queued_messages 1000
max_inflight_messages 20
queue_qos0_messages false

# CANNOT carry anything bigger than a sealed receipt (256 KB). Files go by storage.
max_packet_size 262144

# CANNOT keep anything past delivery: no retained messages.
retain_available false

# CANNOT log who talks to whom (ADR-Q-001: relays keep only that they carried).
# For debugging only, set connection_messages true and switch it back after.
connection_messages false
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
