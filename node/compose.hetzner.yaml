# inQbeta node — the Hetzner test (node/HETZNER.md).
# Used on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.hetzner.yaml up -d
#
# Three jobs (ADR-Q-014): the bellboy (Mosquitto), the directory (Dgraph) and
# the storage (SeaweedFS), and a fourth, the switchboard (coturn) for calls.
# Apart from the switchboard, nothing here is reachable from the internet. Every port is bound to
# localhost (for bin/check.sh) and to the node's Nebula address, 10.42.0.1,
# so only members of the test federation's mesh can reach it.
# Nebula must be up before Docker starts (nebula/nebula.service sees to it).

services:
  mosquitto:
    ports: !override
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
      - "10.42.0.1:1883:1883"   # members only, over the mesh
      - "10.42.0.1:9001:9001"

  # Dgraph: this node's own index (home-node.md §5). Zero keeps the
  # cluster map; Alpha holds the data and answers queries.
  dgraph-zero:
    image: dgraph/dgraph:latest   # pin to the digest after the first pull
    restart: unless-stopped
    networks: [node]
    command: dgraph zero --my=dgraph-zero:5080
    volumes:
      - ./dgraph:/dgraph

  dgraph-alpha:
    image: dgraph/dgraph:latest
    restart: unless-stopped
    networks: [node]
    depends_on: [dgraph-zero]
    # The box has 2 GB. Cap Dgraph's cache so it can't starve Mosquitto.
    # Admin calls only from the mesh and Docker's own networks.
    command: >
      dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080
      --cache size-mb=512
      --security whitelist=10.42.0.0/24,172.16.0.0/12,127.0.0.1
    volumes:
      - ./dgraph:/dgraph
    ports:
      - "127.0.0.1:8080:8080"
      - "10.42.0.1:8080:8080"   # HTTP / GraphQL — members only
      - "10.42.0.1:9080:9080"   # gRPC — members only

  # The storage (ADR-Q-014): the holding bay. Sealed receipts wait here
  # until they're collected and custody passes. SeaweedFS in one process:
  # master, one volume server and the filer. Its volume port is 8081 so it
  # doesn't meet Dgraph on 8080.
  # Size: STORAGE_VOLUMES × STORAGE_VOLUME_MB, from node/.env. The default,
  # 16 × 1 GB, suits a CPX12's 40 GB disk: about 13,000 members at 1 MB each
  # (docs/q/node-capacity.md). It was 8 × 128 MB (1 GB, about 1,000 members)
  # for the first test. Volumes already made keep their size; new ones use this.
  storage:
    image: chrislusf/seaweedfs:latest   # pin to the digest after the first pull
    restart: unless-stopped
    networks: [node]
    command: >
      server -dir=/data -ip=storage -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=${STORAGE_VOLUME_MB:-1024} -volume.max=${STORAGE_VOLUMES:-16} -volume.port=8081
      -filer -filer.port=8888
    volumes:
      - ./storage:/data
    ports:
      - "127.0.0.1:8888:8888"
      - "10.42.0.1:8888:8888"   # the filer — members only

  # The gate in front of the storage (node/gate/server.mjs): stores a
  # federation's announcements only when the federation's signatures check out,
  # then rings the bellboy's news channel. Reached only through Caddy.
  gate:
    image: node:22-alpine
    restart: unless-stopped
    networks: [node]
    depends_on: [storage, mosquitto]
    working_dir: /gate
    command: sh -c "apk add --no-cache mosquitto-clients >/dev/null && node server.mjs"
    environment:
      GATE_FEDERATIONS: ${GATE_FEDERATIONS:-}
      GATE_MINTS: ${GATE_MINTS:-}
      GATE_SEED: ${GATE_SEED:-}
      GATE_RELAY_HOLDS_MB: ${GATE_RELAY_HOLDS_MB:-100}
      GATE_RELAY_DAYS: ${GATE_RELAY_DAYS:-7}
      GATE_RELAY_HOURS: ${GATE_RELAY_HOURS:-}
      GATE_OPERATORS: ${GATE_OPERATORS:-}
      GATE_STORE_GRACE_DAYS: ${GATE_STORE_GRACE_DAYS:-7}
      GATE_MQTT_PASSWORD: ${GATE_MQTT_PASSWORD:-}
      GATE_INBOX_HOLDS_MB: ${GATE_INBOX_HOLDS_MB:-25}
      GATE_SEND_MB_PER_DAY: ${GATE_SEND_MB_PER_DAY:-50}
      GATE_ORIGINS: https://inqbeta.com,https://inqbeta.dev,http://localhost:3100
      # The door (ADR-Q-034): set GATE_DOOR_ROOT and GATE_DOOR_HOST to lock this
      # gate to the founder and tester passes while the host is in test;
      # GATE_DOOR=open once it's live. Unset: no door, as before.
      GATE_DOOR_ROOT: ${GATE_DOOR_ROOT:-}
      GATE_DOOR_HOST: ${GATE_DOOR_HOST:-}
      GATE_DOOR: ${GATE_DOOR:-}
      # Incubator's registrar (ADR-Q-021, ADR-Q-019): only this DID adds to
      # /registry and /core-releases. Unset: nobody can add.
      GATE_REGISTRAR: ${GATE_REGISTRAR:-}
    volumes:
      - ./gate:/gate:ro

  # The development site's own gate (ADR-Q-034 §5): the same code, its own
  # folder in the storage (/dev), no door, never real money. Started only when
  # asked: docker compose --profile dev up -d gate-dev
  # Wiped on its own (HETZNER.md, "Wiping the development site").
  gate-dev:
    profiles: [dev]
    image: node:22-alpine
    restart: unless-stopped
    networks: [node]
    depends_on: [storage, mosquitto]
    working_dir: /gate
    command: sh -c "apk add --no-cache mosquitto-clients >/dev/null && node server.mjs"
    environment:
      GATE_FILER: http://storage:8888/dev
      GATE_FEDERATIONS: ${DEV_GATE_FEDERATIONS:-}
      GATE_MINTS: ${DEV_GATE_MINTS:-}
      GATE_SEED: ${DEV_GATE_SEED:-}
      GATE_RELAY_HOLDS_MB: ${DEV_GATE_RELAY_HOLDS_MB:-100}
      GATE_RELAY_DAYS: ${GATE_RELAY_DAYS:-7}
      GATE_RELAY_HOURS: ${GATE_RELAY_HOURS:-}
      GATE_OPERATORS: ${DEV_GATE_OPERATORS:-}
      GATE_STORE_GRACE_DAYS: ${GATE_STORE_GRACE_DAYS:-7}
      GATE_MQTT_PASSWORD: ${GATE_MQTT_PASSWORD:-}
      GATE_INBOX_HOLDS_MB: ${GATE_INBOX_HOLDS_MB:-25}
      GATE_SEND_MB_PER_DAY: ${GATE_SEND_MB_PER_DAY:-50}
      GATE_ORIGINS: https://inqbeta.dev,http://localhost:3100
      GATE_REGISTRAR: ${DEV_GATE_REGISTRAR:-}
    volumes:
      - ./gate:/gate:ro

  # The node's two public front doors, with certificates (node/caddy/Caddyfile).
  # The only ports open to the internet besides SSH and Nebula.
  caddy:
    image: caddy:2
    restart: unless-stopped
    networks: [node]
    depends_on: [gate, mosquitto]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config

  # The switchboard (node/coturn/turnserver.conf): the host's own TURN relay,
  # connecting calls between devices that can't reach each other. (The service
  # and profile keep the technical name, relay.) Unlike everything above,
  # it has to be reachable from the internet: Hetzner's firewall opens
  # 3478 (UDP and TCP) and 49160-49999 (UDP). It carries only encrypted media
  # it can't read, and refuses to relay into private networks or the mesh.
  # Host networking, because a relay needs a large range of UDP ports.
  # Q points at it with Q_TURN_URLS and the same secret as Q_TURN_SECRET.
  # It listens and relays on the public address only: never on the mesh
  # (10.42.0.1) or Docker's own networks, which it would otherwise pick up.
  # Started on its own: docker compose --profile relay up -d relay
  relay:
    image: coturn/coturn:latest   # pin to the digest after the first pull
    profiles: [relay]
    restart: unless-stopped
    network_mode: host
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET:-}
      --external-ip=${TURN_PUBLIC_IP:-135.181.156.21}
      --listening-ip=${TURN_PUBLIC_IP:-135.181.156.21}
      --relay-ip=${TURN_PUBLIC_IP:-135.181.156.21}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
