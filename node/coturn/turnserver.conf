# The relay (ADR-Q-004 §3, ADR-Q-017 §3): the host's own TURN server, coturn.
#
# Most calls never touch it. When two devices can't reach each other, the
# encrypted media bounces off here. It can't read it (DTLS-SRTP, keyed to the
# fingerprints both people signed): it only moves packets.
#
# No users are stored. Q mints a username and password per call from the
# shared secret (apps/q/src/lib/server/turn.ts); the relay checks them alone.
# The secret is passed on the command line from node/.env (TURN_SECRET), so it
# isn't in this file or in git.

listening-port=3478
# Relayed media uses these ports. Each relayed person holds one while the call
# lasts, so 49160-49999 is room for about 400 relayed calls at once.
min-port=49160
max-port=49999

realm=inqbeta
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# A relay must never become a way into private networks: not the node's own
# services, not the Nebula mesh, not anyone's home network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-loopback-peers

# Fair shares, so one person can't take the whole pipe.
# Per allocation: about 4 Mbit/s, enough for one person's HD video.
max-bps=500000
# At most 4 relayed calls' worth per username (one person on one call is one).
user-quota=4
total-quota=800

log-file=stdout
simple-log
